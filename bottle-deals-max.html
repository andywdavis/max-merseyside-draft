  function playCheers(force){
    if(soundPending||soundStarted&&!force)return;
    if(force){soundStarted=false; try{audio.currentTime=0;}catch(_){} }
    soundPending=true;
    try{

  const MAX_PHONE='447836603701';
  function personalise(html){
    // Keep the source seven deals unchanged; rewrite only representative details.
    return html
      .replace(/\+44[\s-]*\(?0?\)?[\s-]*7836[\s-]*776[\s-]*302/g,'+44 7836 603701')

  function tidyButtons(){
    const send=document.getElementById('send');
    if(send){

      send.classList.toggle('booze-highlight',/SEND ME MY BOOZE/i.test(send.textContent||''));
    }
    const finish=document.getElementById('finishSend');
    if(finish){
      if(/SEND TO MAX|SEND ON WHATSAPP|SEND MY ORDER/i.test(finish.textContent||''))finish.textContent='🍾 SEND ME MY BOOZE!';
      finish.classList.add('booze-highlight');
    }
    document.querySelectorAll('button').forEach(b=>{
      if(/^(?:💬\s*)?WhatsApp Max$/i.test((b.textContent||'').trim()))b.hidden=true;

  function shareMate(){
    const msg='🍻 FREE DRINKS with R&J trade deals!\nFrom Max Westwell • Merseyside Division\n\nPick a deal and claim your free bottle: '+SHARE;
    const url='https://wa.me/?text='+encodeURIComponent(msg.replace(/\\n/g,'\n'));

  function mount(){
    // Never lock the main scrolling document.
    document.documentElement.style.setProperty('overflow-y','auto','important');
    document.body.style.setProperty('overflow-y','visible','important');
    const style=document.createElement('style');style.id='andy-scroll-fix';style.textContent=fixCSS;document.head.append(style);
    const footer=document.querySelector('.footer-note');
    if(!document.getElementById('andy-friends-share')){
      const panel=document.createElement('div');panel.id='andy-friends-share';panel.className='friends-share';
      const title=document.createElement('strong');title.textContent='Good mates share good deals. Great mates share FREE DRINKS!';
      const button=document.createElement('button');button.type='button';button.textContent='🍻 SHARE WITH A MATE';button.addEventListener('click',shareMate);
      panel.append(title,button);if(footer)footer.before(panel);else document.querySelector('main')?.append(panel);
    }
    // A replay button also makes sound available when a mobile browser blocks autoplay.
    const replay=document.createElement('button');replay.type='button';replay.id='andy-cheers';
    replay.textContent='🔊';replay.title='Hear Cheers, my friend';replay.setAttribute('aria-label','Play Cheers, my friend');
    replay.addEventListener('click',()=>playCheers(true));document.body.append(replay);
    document.addEventListener('pointerdown',e=>{if(e.target.closest?.('#andy-cheers'))return;playCheers(false);},{capture:true,passive:true});
    document.addEventListener('touchstart',e=>{if(e.target.closest?.('#andy-cheers'))return;playCheers(false);},{capture:true,passive:true});
    document.addEventListener('keydown',()=>playCheers(false),{capture:true});
    tidyButtons();
    let busy=false;
    const mo=new MutationObserver(()=>{if(busy)return;busy=true;try{tidyButtons();}finally{busy=false;}});

    playCheers(false);
  }
